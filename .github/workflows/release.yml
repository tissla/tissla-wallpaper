name: Release binaries

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: false

      - name: Build
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go build \
            -trimpath \
            -ldflags="-s -w" \
            -o "twp-cli-linux-amd64" \
            ./cmd/cli

          go build \
            -trimpath \
            -ldflags="-s -w" \
            -o "twp-daemon-linux-amd64" \
            ./cmd/daemon

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: twp-linux-amd64
          path: |
            twp-cli-linux-amd64
            twp-daemon-linux-amd64

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            twp-cli-*
            twp-daemon-*
