name: Release binaries

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: false

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build \
            -trimpath \
            -ldflags="-s -w" \
            -o "twp-cli-${GOOS}-${GOARCH}" \
            ./cmd/cli

          go build \
            -trimpath \
            -ldflags="-s -w" \
            -o "twp-daemon-${GOOS}-${GOARCH}" \
            ./cmd/daemon

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: twp-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            twp-cli-${{ matrix.goos }}-${{ matrix.goarch }}
            twp-daemon-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            twp-cli-*
            twp-daemon-*
